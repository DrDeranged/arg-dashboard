<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG Collections — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --panel: #161d26;
    --panel-deep: #0a0e13;
    --line: #232d3a;
    --text: #e8ecf1;
    --text-dim: #8a95a3;
    --money: #35c99a;
    --gold: #f2a72e;
    --coral: #f0997b;
    --accent-bg: #2b2564;
    --accent-text: #cecbf6;
    --accent-bright: #eeedfe;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Barlow', system-ui, sans-serif;
    overflow: hidden;
  }
  .board {
    height: 100vh;
    display: flex; flex-direction: column;
    padding: 2.2vh 2.4vw; gap: 1.8vh;
  }

  /* ---------- Header ---------- */
  .hdr { display: flex; justify-content: space-between; align-items: baseline; }
  .hdr-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 3.4vh;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .hdr-title span { color: var(--money); }
  .hdr-right { display: flex; gap: 2vw; align-items: baseline; font-size: 2vh; color: var(--text-dim); }
  .hdr-clock {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; font-size: 3vh; color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Department progress ---------- */
  .dept { background: var(--panel); border-radius: 1.4vh; padding: 1.8vh 1.8vw; }
  .dept-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.2vh; }
  .label {
    font-size: 1.9vh; color: var(--text-dim);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .dept-nums {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; font-size: 2.9vh;
    font-variant-numeric: tabular-nums;
  }
  .dept-nums .pct { color: var(--money); margin-left: 1vw; }
  .bar-track { height: 3.4vh; background: var(--panel-deep); border-radius: 1.7vh; overflow: hidden; }
  .bar-fill {
    height: 100%; width: 0%;
    background: var(--money); border-radius: 1.7vh;
    transition: width 1.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .bar-fill.over-goal { background: var(--gold); }

  /* ---------- Main grid ---------- */
  .main { flex: 1; display: grid; grid-template-columns: 1.35fr 1fr; gap: 1.4vw; min-height: 0; }
  .lb {
    background: var(--panel); border-radius: 1.4vh;
    padding: 1.8vh 1.6vw;
    display: flex; flex-direction: column; min-height: 0;
  }
  .lb-head { display: flex; justify-content: space-between; align-items: baseline; }
  .lb-page-note { font-size: 1.7vh; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .lb-rows { flex: 1; display: flex; flex-direction: column; justify-content: space-around; min-height: 0; }
  .lb-row {
    display: flex; align-items: center; gap: 1vw;
    padding: 0.8vh 0; border-bottom: 1px solid var(--line);
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 3vh; width: 2.2vw;
    color: var(--text-dim); text-align: center;
  }
  .lb-row.first .lb-rank { color: var(--gold); }
  .lb-name { flex: 1; font-size: 2.7vh; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-move { font-size: 2vh; width: 2.4vw; text-align: center; font-variant-numeric: tabular-nums; }
  .lb-move.up { color: var(--money); }
  .lb-move.down { color: var(--coral); }
  .lb-move.flat { color: var(--text-dim); }
  .lb-bar { width: 13vw; height: 1.6vh; background: var(--panel-deep); border-radius: 0.8vh; overflow: hidden; }
  .lb-bar div { height: 100%; background: var(--money); border-radius: 0.8vh; transition: width 1.2s ease-out; }
  .lb-row.first .lb-bar div { background: var(--gold); }
  .lb-pct {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; font-size: 3vh; width: 4vw;
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .lb-mtd { font-size: 1.9vh; color: var(--text-dim); width: 6.5vw; text-align: right; font-variant-numeric: tabular-nums; }
  .lb.dense .lb-name { font-size: 2.2vh; }
  .lb.dense .lb-pct { font-size: 2.4vh; }
  .lb.dense .lb-rank { font-size: 2.4vh; }
  .lb.dense .lb-mtd { font-size: 1.7vh; }
  .lb.dense .lb-row { padding: 0.4vh 0; }

  .right-col { display: grid; grid-template-rows: 1.25fr 1fr; gap: 1.8vh; min-height: 0; }
  .card {
    background: var(--panel); border-radius: 1.4vh;
    padding: 1.8vh 1.6vw;
    display: flex; flex-direction: column; justify-content: center;
  }
  .today-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 7.5vh; line-height: 1.05;
    color: var(--money); margin: 0.6vh 0;
    font-variant-numeric: tabular-nums;
  }
  .today-num.pulse { animation: pulse 0.9s ease-out; }
  @keyframes pulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.06); color: #7fe7c4; }
    100% { transform: scale(1); }
  }
  .today-sub { font-size: 2.2vh; color: var(--text-dim); }
  .today-sub b { color: var(--text); font-weight: 600; }
  .blitz-lead { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 3.6vh; margin: 0.5vh 0; }
  .blitz-days { display: flex; gap: 0.4vw; margin-top: 1vh; }
  .blitz-day { flex: 1; height: 1.2vh; border-radius: 0.6vh; background: var(--panel-deep); }
  .blitz-day.done { background: var(--gold); }

  /* ---------- Rotating banner ---------- */
  .banner {
    background: var(--accent-bg); border-radius: 1.4vh;
    padding: 1.6vh 1.8vw;
    display: flex; align-items: center; gap: 1.2vw;
    min-height: 9vh;
    transition: opacity 0.5s ease;
  }
  .banner.fade { opacity: 0; }
  .banner-icon { width: 4.6vh; height: 4.6vh; flex-shrink: 0; color: var(--accent-text); }
  .banner-label { font-size: 1.9vh; color: var(--accent-text); letter-spacing: 0.06em; text-transform: uppercase; }
  .banner-text { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 3.4vh; color: var(--accent-bright); }
  .banner-dots { margin-left: auto; display: flex; gap: 0.5vw; }
  .banner-dot { width: 1.1vh; height: 1.1vh; border-radius: 50%; background: rgba(255,255,255,0.22); }
  .banner-dot.active { background: var(--accent-bright); }

  /* ---------- Celebration overlay ---------- */
  .celebrate {
    position: fixed; inset: 0;
    background: rgba(13, 17, 23, 0.88);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 2vh; z-index: 50;
  }
  .celebrate.show { display: flex; animation: celebIn 0.4s ease-out; }
  @keyframes celebIn { from { opacity: 0; } to { opacity: 1; } }
  .celebrate-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 9vh; color: var(--gold);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .celebrate-text { font-size: 4vh; color: var(--text); }

  /* ---------- After-hours (final score) screen ---------- */
  .after {
    position: fixed; inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 3vh; z-index: 40;
    padding: 4vh 6vw;
  }
  body.after-hours .after { display: flex; }
  .after-label {
    font-size: 2.4vh; color: var(--text-dim);
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .after-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 14vh; line-height: 1;
    color: var(--money); font-variant-numeric: tabular-nums;
  }
  .after-sub { font-size: 3vh; color: var(--text); }
  .after-sub .gold { color: var(--gold); font-weight: 600; }
  .after-bar { width: 60vw; height: 3vh; background: var(--panel-deep); border-radius: 1.5vh; overflow: hidden; }
  .after-bar div { height: 100%; background: var(--money); border-radius: 1.5vh; }
  .after-month { font-size: 2.4vh; color: var(--text-dim); }
  .after-tomorrow {
    margin-top: 2vh; padding: 1.6vh 3vw;
    background: var(--panel); border-radius: 1.4vh;
    font-size: 2.8vh;
  }
  .after-tomorrow b { color: var(--gold); }

  .stale { color: var(--coral) !important; }

  @media (prefers-reduced-motion: reduce) {
    .bar-fill, .lb-bar div { transition: none; }
    .today-num.pulse { animation: none; }
  }
</style>
</head>
<body>

<div class="board">

  <div class="hdr">
    <div class="hdr-title">ARG <span>Collections</span> — <span id="month-label">—</span></div>
    <div class="hdr-right">
      <span id="updated-label">Updated —</span>
      <span class="hdr-clock" id="clock">—:—</span>
    </div>
  </div>

  <div class="dept">
    <div class="dept-row">
      <span class="label">Department goal</span>
      <span class="dept-nums">
        <span id="dept-collected">$0</span> of <span id="dept-goal">$0</span>
        <span class="pct" id="dept-pct">0%</span>
      </span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="dept-bar"></div></div>
  </div>

  <div class="main">
    <div class="lb" id="lb">
      <div class="lb-head">
        <span class="label">Leaderboard — % of monthly goal</span>
        <span class="lb-page-note" id="lb-page-note"></span>
      </div>
      <div class="lb-rows" id="lb-rows"></div>
    </div>
    <div class="right-col">
      <div class="card">
        <span class="label">Collected today</span>
        <div class="today-num" id="today-num">$0</div>
        <div class="today-sub" id="today-sub">Goal $0</div>
      </div>
      <div class="card">
        <span class="label" id="blitz-label">10-day blitz</span>
        <div class="blitz-lead" id="blitz-lead">—</div>
        <div class="today-sub" id="blitz-sub"></div>
        <div class="blitz-days" id="blitz-days"></div>
      </div>
    </div>
  </div>

  <div class="banner" id="banner">
    <svg class="banner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0V4zM7 6H4a2 2 0 0 0 2 4h1M17 6h3a2 2 0 0 1-2 4h-1"/>
    </svg>
    <div>
      <div class="banner-label" id="banner-label">—</div>
      <div class="banner-text" id="banner-text">—</div>
    </div>
    <div class="banner-dots" id="banner-dots"></div>
  </div>

</div>

<div class="celebrate" id="celebrate">
  <div class="celebrate-title" id="celebrate-title">New largest payment</div>
  <div class="celebrate-text" id="celebrate-text"></div>
</div>

<div class="after">
  <div class="after-label">Final score — <span id="after-date">today</span></div>
  <div class="after-num" id="after-num">$0</div>
  <div class="after-sub" id="after-sub">—</div>
  <div class="after-bar"><div id="after-bar"></div></div>
  <div class="after-month" id="after-month">—</div>
  <div class="after-tomorrow" id="after-tomorrow">Tomorrow's goal: <b>$0</b></div>
</div>

<script>
/* =====================================================================
   ARG COLLECTIONS TV DASHBOARD — v1.1 "Command Center"
   ---------------------------------------------------------------------
   ALL TUNABLES LIVE IN CONFIG BELOW. Everything else is plumbing.

   DATA:
   - CONFIG.SHEET_ID empty  -> SAMPLE_DATA renders (demo mode)
   - CONFIG.SHEET_ID set    -> polls the Google Sheet via public gviz
     endpoint every REFRESH_SECONDS. Sheet must be shared
     "Anyone with the link can view".

   EXPECTED SHEET LAYOUT (matches ARG_TV_Dashboard_Template.xlsx):

   Tab "State"      — column A = key, column B = value
     monthLabel, deptGoal, deptCollected, todayGoal, todayCollected,
     blitzDay, blitzTotalDays, blitzLeader, blitzLeaderPct,
     banner1Label, banner1Text, banner2Label, banner2Text, ... up to 5

   Tab "Collectors" — header row, then: Name | MTD | Goal | Move
   ===================================================================== */

const CONFIG = {
  SHEET_ID: "",                 // <-- paste Google Sheet ID here to go live
  REFRESH_SECONDS: 60,          // Sheet poll interval
  BANNER_ROTATE_SECONDS: 15,    // bottom banner rotation
  STALE_AFTER_MINUTES: 30,      // "Updated" turns red after this
  NIGHTLY_RELOAD_HOUR: 4,       // full page reload at this hour (0-23)
  AFTER_HOURS: {
    enabled: true,
    startHour: 8,               // board shows live mode from 8:00 AM...
    endHour: 18.5               // ...until 6:30 PM, then final-score mode
  },
  LEADERBOARD: {
    pageSize: 8,                // rows per page before paging kicks in
    pageSeconds: 20,            // rotation speed when roster > pageSize
    denseAbove: 6               // shrink row typography above this count
  },
  CELEBRATION_SECONDS: 8,       // largest-payment takeover duration
  COUNTUP_MS: 900               // dollar figures roll to new values
};

const SAMPLE_DATA = {
  monthLabel: "July 2026",
  deptGoal: 600000,
  deptCollected: 412750,
  todayGoal: 25000,
  todayCollected: 18940,
  blitz: { day: 7, totalDays: 10, leader: "Dipto R.", leaderPct: 94 },
  banners: [
    { label: "Largest payment today", text: "$7,250 — Ray M. \u00b7 settlement payoff" },
    { label: "Collector of the day", text: "Dipto R. — $9,410 collected, 3 plans approved" },
    { label: "Hot streak", text: "Ray — 11 straight days collecting" }
  ],
  collectors: [
    { name: "Dipto R.", mtd: 61600, goal: 70000, move: 0 },
    { name: "Ray M.",   mtd: 56700, goal: 70000, move: 1 },
    { name: "Lori S.",  mtd: 51800, goal: 70000, move: -1 },
    { name: "Jake T.",  mtd: 43400, goal: 70000, move: 2 },
    { name: "Ahmad K.", mtd: 39900, goal: 70000, move: 0 },
    { name: "Huda N.",  mtd: 36200, goal: 70000, move: -1 }
  ]
};

/* ---------- helpers ---------- */
const money = n => "$" + Math.round(n).toLocaleString("en-US");
const pct = (a, b) => b > 0 ? Math.round((a / b) * 100) : 0;

function countUp(el, from, to, prefixFn) {
  if (from === to || from == null) { el.textContent = prefixFn(to); return; }
  const start = performance.now();
  const dur = CONFIG.COUNTUP_MS;
  function step(now) {
    const t = Math.min((now - start) / dur, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = prefixFn(from + (to - from) * eased);
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- state ---------- */
let lastData = null;
let lastUpdated = null;
let bannerIndex = 0;
let lbPage = 0;
let prev = { today: null, dept: null, largestBanner: null };

/* ---------- render ---------- */
function render(data) {
  lastData = data;

  document.getElementById("month-label").textContent = data.monthLabel;

  const dPct = pct(data.deptCollected, data.deptGoal);
  countUp(document.getElementById("dept-collected"), prev.dept, data.deptCollected, money);
  prev.dept = data.deptCollected;
  document.getElementById("dept-goal").textContent = money(data.deptGoal);
  document.getElementById("dept-pct").textContent = dPct + "%";
  const bar = document.getElementById("dept-bar");
  bar.style.width = Math.min(dPct, 100) + "%";
  bar.classList.toggle("over-goal", dPct >= 100);

  renderLeaderboard();

  const todayEl = document.getElementById("today-num");
  countUp(todayEl, prev.today, data.todayCollected, money);
  if (prev.today !== null && data.todayCollected > prev.today) {
    todayEl.classList.remove("pulse");
    void todayEl.offsetWidth;
    todayEl.classList.add("pulse");
  }
  prev.today = data.todayCollected;

  const remaining = data.todayGoal - data.todayCollected;
  document.getElementById("today-sub").innerHTML = remaining > 0
    ? `Goal ${money(data.todayGoal)} — <b>${money(remaining)} to go</b>`
    : `Goal ${money(data.todayGoal)} — <b>beat by ${money(-remaining)}</b>`;

  const bz = data.blitz;
  document.getElementById("blitz-label").textContent = `${bz.totalDays}-day blitz — day ${bz.day}`;
  document.getElementById("blitz-lead").textContent = `${bz.leader} leads at ${bz.leaderPct}%`;
  const daysLeft = bz.totalDays - bz.day;
  document.getElementById("blitz-sub").textContent =
    daysLeft > 0 ? `${daysLeft} day${daysLeft === 1 ? "" : "s"} remaining` : "Final day";
  document.getElementById("blitz-days").innerHTML =
    Array.from({ length: bz.totalDays }, (_, i) =>
      `<div class="blitz-day ${i < bz.day ? "done" : ""}"></div>`).join("");

  const largest = data.banners && data.banners[0] ? data.banners[0].text : null;
  if (prev.largestBanner !== null && largest && largest !== prev.largestBanner) {
    celebrate("New largest payment", largest);
  }
  prev.largestBanner = largest;

  renderBanner();
  renderAfterHours();
  markUpdated();
}

/* ---------- leaderboard with paging + density ---------- */
function rankedCollectors() {
  return [...(lastData ? lastData.collectors : [])]
    .map(c => ({ ...c, pct: pct(c.mtd, c.goal) }))
    .sort((a, b) => b.pct - a.pct);
}

function renderLeaderboard() {
  const all = rankedCollectors();
  const size = CONFIG.LEADERBOARD.pageSize;
  const pages = Math.max(1, Math.ceil(all.length / size));
  lbPage = lbPage % pages;
  const slice = all.slice(lbPage * size, lbPage * size + size);
  const offset = lbPage * size;

  document.getElementById("lb").classList.toggle("dense", slice.length > CONFIG.LEADERBOARD.denseAbove);
  document.getElementById("lb-page-note").textContent =
    pages > 1 ? `${lbPage + 1} / ${pages}` : "";

  document.getElementById("lb-rows").innerHTML = slice.map((c, i) => {
    const rank = offset + i + 1;
    const moveCls = c.move > 0 ? "up" : c.move < 0 ? "down" : "flat";
    const moveTxt = c.move > 0 ? "\u25B2" + c.move : c.move < 0 ? "\u25BC" + Math.abs(c.move) : "\u2013";
    return `
      <div class="lb-row ${rank === 1 ? "first" : ""}">
        <span class="lb-rank">${rank}</span>
        <span class="lb-name">${c.name}</span>
        <span class="lb-move ${moveCls}">${moveTxt}</span>
        <span class="lb-mtd">${money(c.mtd)}</span>
        <div class="lb-bar"><div style="width:${Math.min(c.pct, 100)}%"></div></div>
        <span class="lb-pct">${c.pct}%</span>
      </div>`;
  }).join("");
}

setInterval(() => {
  if (!lastData) return;
  const pages = Math.ceil(rankedCollectors().length / CONFIG.LEADERBOARD.pageSize);
  if (pages > 1) { lbPage++; renderLeaderboard(); }
}, CONFIG.LEADERBOARD.pageSeconds * 1000);

/* ---------- rotating banner ---------- */
function renderBanner() {
  const banners = (lastData && lastData.banners) || [];
  if (!banners.length) return;
  bannerIndex = bannerIndex % banners.length;
  const b = banners[bannerIndex];
  document.getElementById("banner-label").textContent = b.label;
  document.getElementById("banner-text").textContent = b.text;
  document.getElementById("banner-dots").innerHTML = banners.map((_, i) =>
    `<div class="banner-dot ${i === bannerIndex ? "active" : ""}"></div>`).join("");
}

setInterval(() => {
  const el = document.getElementById("banner");
  el.classList.add("fade");
  setTimeout(() => { bannerIndex++; renderBanner(); el.classList.remove("fade"); }, 500);
}, CONFIG.BANNER_ROTATE_SECONDS * 1000);

/* ---------- celebration ---------- */
function celebrate(title, text) {
  document.getElementById("celebrate-title").textContent = title;
  document.getElementById("celebrate-text").textContent = text;
  const el = document.getElementById("celebrate");
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), CONFIG.CELEBRATION_SECONDS * 1000);
}

/* ---------- after-hours final-score mode ---------- */
function isAfterHours() {
  if (!CONFIG.AFTER_HOURS.enabled) return false;
  const now = new Date();
  const h = now.getHours() + now.getMinutes() / 60;
  return h < CONFIG.AFTER_HOURS.startHour || h >= CONFIG.AFTER_HOURS.endHour;
}

function renderAfterHours() {
  const on = isAfterHours();
  document.body.classList.toggle("after-hours", on);
  if (!on || !lastData) return;
  const d = lastData;
  document.getElementById("after-date").textContent =
    new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  document.getElementById("after-num").textContent = money(d.todayCollected);
  const top = rankedCollectors()[0];
  document.getElementById("after-sub").innerHTML = top
    ? `Top collector: <span class="gold">${top.name}</span> \u00b7 ${top.pct}% of goal`
    : "";
  const dPct = pct(d.deptCollected, d.deptGoal);
  document.getElementById("after-bar").style.width = Math.min(dPct, 100) + "%";
  document.getElementById("after-month").textContent =
    `${d.monthLabel}: ${money(d.deptCollected)} of ${money(d.deptGoal)} \u2014 ${dPct}%`;
  document.getElementById("after-tomorrow").innerHTML =
    `Tomorrow's goal: <b>${money(d.todayGoal)}</b>`;
}

setInterval(renderAfterHours, 60 * 1000);

/* ---------- clock, staleness, nightly reload ---------- */
function tickClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  const upd = document.getElementById("updated-label");
  if (lastUpdated) {
    const mins = Math.floor((now - lastUpdated) / 60000);
    upd.textContent = mins < 1 ? "Updated just now" : `Updated ${mins} min ago`;
    upd.classList.toggle("stale", mins >= CONFIG.STALE_AFTER_MINUTES);
  }
}
setInterval(tickClock, 5000);

function markUpdated() { lastUpdated = new Date(); tickClock(); }

function scheduleNightlyReload() {
  const now = new Date();
  const next = new Date(now);
  next.setHours(CONFIG.NIGHTLY_RELOAD_HOUR, 0, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  setTimeout(() => location.reload(), next - now);
}

/* ---------- Google Sheet loader (gviz JSON endpoint) ---------- */
async function fetchSheetTab(tabName) {
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tabName)}`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.substring(text.indexOf("(") + 1, text.lastIndexOf(")")));
  return json.table.rows.map(r => (r.c || []).map(c => (c ? (c.v ?? "") : "")));
}

async function loadFromSheet() {
  const [stateRows, collectorRows] = await Promise.all([
    fetchSheetTab("State"),
    fetchSheetTab("Collectors")
  ]);

  const kv = {};
  stateRows.forEach(r => { if (r[0]) kv[String(r[0]).trim()] = r[1]; });

  const banners = [];
  for (let i = 1; i <= 5; i++) {
    if (kv[`banner${i}Label`] && kv[`banner${i}Text`]) {
      banners.push({ label: String(kv[`banner${i}Label`]), text: String(kv[`banner${i}Text`]) });
    }
  }

  const collectors = collectorRows
    .filter(r => r[0] && !isNaN(Number(r[1])))
    .map(r => ({
      name: String(r[0]),
      mtd: Number(r[1]),
      goal: Number(r[2]) || 1,
      move: Number(r[3]) || 0
    }));

  return {
    monthLabel: String(kv.monthLabel || ""),
    deptGoal: Number(kv.deptGoal) || 0,
    deptCollected: Number(kv.deptCollected) || 0,
    todayGoal: Number(kv.todayGoal) || 0,
    todayCollected: Number(kv.todayCollected) || 0,
    blitz: {
      day: Number(kv.blitzDay) || 0,
      totalDays: Number(kv.blitzTotalDays) || 10,
      leader: String(kv.blitzLeader || "\u2014"),
      leaderPct: Number(kv.blitzLeaderPct) || 0
    },
    banners: banners.length ? banners : [{ label: "ARG Collections", text: "Let's get it." }],
    collectors
  };
}

async function refresh() {
  try {
    const data = CONFIG.SHEET_ID ? await loadFromSheet() : SAMPLE_DATA;
    render(data);
  } catch (err) {
    console.error("Dashboard refresh failed:", err);
  }
}

/* ---------- boot ---------- */
refresh();
tickClock();
scheduleNightlyReload();
if (CONFIG.SHEET_ID) setInterval(refresh, CONFIG.REFRESH_SECONDS * 1000);
</script>
